<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">
          <i class="fas fa-home"></i> Emran Awel | portfolio
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about me.html">About me</a></li>
          <li><a href="contact.html">Contact me</a></li>
        </ul>
      </nav>
    </header>

    <section class="section-contact hero" >
      <div class="contact-container">
        <h2 class="section-title-c text-dark">Contact Me</h2>
        <p class="contact-subtitle">Have a question or want to get in touch? Drop me a message below!</p>
        
        <form class="contact-form" action="#" method="POST">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required />
          </div>

          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Send Message</button>
        </form>
      </div>
    </section>

    <footer class="footer">
      <div>
        <p>All writes are reserved.&copy;2026 Emran Awel</p>
      </div>

        </ul>
      </div>
    </footer>
  </body>
</html>
